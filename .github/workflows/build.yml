name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd "$(dirname "$(find . -name project.yml | head -1)")"
          xcodegen generate

      - name: Build (unsigned)
        run: |
          cd "$(dirname "$(find . -name project.yml | head -1)")"
          xcodebuild -project PhoneCam.xcodeproj -scheme PhoneCam \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneCam.app Payload/
          zip -r PhoneCam.ipa Payload
          echo "IPA_DIR=$(pwd)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-ipa
          path: ${{ env.IPA_DIR }}/PhoneCam.ipa
